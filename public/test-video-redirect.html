<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Redirect Test</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; padding: 20px; }
  h2 { color: #daa520; margin-bottom: 4px; }
  .grid { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
  .tile {
    width: 220px; background: #1e2a3a; border: 1px solid #2a3a4a;
    border-radius: 10px; overflow: hidden; position: relative;
  }
  .tile video { width: 100%; height: 160px; object-fit: cover; background: #000; display: block; }
  .label { padding: 6px 10px; font-size: 11px; color: #aaa; }
  .status { padding: 4px 10px 8px; font-size: 10px; font-weight: bold; }
  .ok { color: #4ade80; }
  .fail { color: #f87171; }
  .loading { color: #facc15; }
  .badge {
    position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: bold;
    padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
  }
  .proxy-badge { background: #7c3aed; color: #fff; }
  .redirect-badge { background: #0f766e; color: #fff; }
</style>
</head>
<body>

<h1 style="color:#daa520; margin-bottom: 24px;">X Video: Proxy vs Redirect Test</h1>
<p style="color:#888; margin-bottom: 28px; font-size:13px;">
  Each row tests the same tweet ID. <strong style="color:#7c3aed">PROXY</strong> streams through Vercel.
  <strong style="color:#0f766e">REDIRECT</strong> sends the browser direct to Twitter CDN — zero Vercel bytes if it works.
</p>

<div id="rows"></div>

<script>
const tweetIds = [
  '2042229585622827298',
  '2042344451046015102',
  '2042564117655920681',
];

const rows = document.getElementById('rows');

tweetIds.forEach(id => {
  const section = document.createElement('div');
  section.style.marginBottom = '28px';

  const heading = document.createElement('h2');
  heading.textContent = `Tweet ${id}`;
  section.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'grid';

  // PROXY tile
  const proxyTile = makeTile(id, 'proxy');
  // REDIRECT tile
  const redirectTile = makeTile(id, 'redirect');

  grid.appendChild(proxyTile);
  grid.appendChild(redirectTile);
  section.appendChild(grid);
  rows.appendChild(section);
});

function makeTile(id, mode) {
  const tile = document.createElement('div');
  tile.className = 'tile';

  const badge = document.createElement('span');
  badge.className = 'badge ' + (mode === 'proxy' ? 'proxy-badge' : 'redirect-badge');
  badge.textContent = mode;
  tile.appendChild(badge);

  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.controls = true;
  video.autoplay = true;
  video.preload = 'auto';

  const src = mode === 'proxy'
    ? `/api/x-video?id=${id}`
    : `/api/x-video-redirect?id=${id}`;

  const status = document.createElement('div');
  status.className = 'status loading';
  status.textContent = 'Loading...';

  video.addEventListener('loadedmetadata', () => {
    status.className = 'status ok';
    status.textContent = `OK — ${Math.round(video.duration)}s`;
  });
  video.addEventListener('error', (e) => {
    status.className = 'status fail';
    status.textContent = 'FAILED — ' + (video.error?.message || 'unknown error');
  });
  video.addEventListener('stalled', () => {
    status.className = 'status fail';
    status.textContent = 'STALLED';
  });

  video.src = src;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = mode === 'proxy' ? '/api/x-video (current)' : '/api/x-video-redirect (test)';

  tile.appendChild(video);
  tile.appendChild(label);
  tile.appendChild(status);
  return tile;
}
</script>
</body>
</html>
